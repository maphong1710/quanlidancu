<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản trị hệ thống - Groupod</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* Toàn bộ Style gốc được giữ nguyên tại đây */
    :root { --sidebar-bg: #1e1e2d; --sidebar-fg: #a2a3b7; --primary: #5a73f3; --primary-glow: rgba(90, 115, 243, 0.35); --bg-main: #f4f7f9; --card-bg: #ffffff; --text-main: #2d3748; --text-muted: #718096; --border: #edf2f7; }
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; margin: 0; display: flex; background-color: var(--bg-main); height: 100vh; overflow: hidden; }
    .sidebar { width: 260px; background-color: var(--sidebar-bg); display: flex; flex-direction: column; z-index: 100; }
    .sidebar-header { height: 64px; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .logo-box { width: 32px; height: 32px; background: var(--primary); border-radius: 8px; margin-right: 12px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
    .nav-group-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(162, 163, 183, 0.3); padding: 24px 24px 8px; }
    .nav-item { display: flex; align-items: center; padding: 11px 24px; margin: 2px 12px; border-radius: 8px; font-size: 14px; color: var(--sidebar-fg); text-decoration: none; cursor: pointer; }
    .nav-item:hover { background: rgba(255, 255, 255, 0.05); color: white; }
    .nav-item.active { background-color: var(--primary); color: white; box-shadow: 0 8px 15px var(--primary-glow); }
    .main-layout { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .top-bar { height: 64px; background: white; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 30px; justify-content: flex-end; }
    .content-area { flex: 1; overflow-y: auto; padding: 30px; }
    /* Style cho các thành phần con nạp vào */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
    .stat-card span { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    .stat-card h3 { font-size: 26px; margin: 8px 0 0 0; }
    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 30px; }
    .card { background: white; padding: 25px; border-radius: 12px; border: 1px solid var(--border); }
    .card h4 { margin: 0 0 20px 0; font-size: 16px; color: var(--text-main); border-left: 4px solid var(--primary); padding-left: 10px; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 11px; color: var(--text-muted); text-transform: uppercase; padding: 15px; border-bottom: 1px solid var(--border); }
    td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 14px; }
    .code-badge { font-family: monospace; font-size: 12px; background: rgba(36, 121, 232, 0.1); color: var(--primary); padding: 4px 8px; border-radius: 4px; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .bg-success { background: rgba(16, 185, 129, 0.1); color: #10b981; }
    .bg-warning { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
    .search-bar { width: 100%; max-width: 400px; padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border); background: white; margin-bottom: 20px; outline: none; }
    .btn-action { padding: 8px 16px; border-radius: 8px; border: none; background: var(--primary); color: white; cursor: pointer; font-weight: 500; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-box">G</div>
      <div>
        <div style="color: white; font-size: 14px; font-weight: bold;">Quản lý Dân cư</div>
        <div style="color: rgba(255,255,255,0.4); font-size: 10px; font-weight: 600;">ADMIN</div>
      </div>
    </div>
    <nav style="flex: 1;">
      <div class="nav-group-label">Tổng quan</div>
      <div id="nav-dashboard" class="nav-item active" onclick="loadPage('dashboard', this)">Dashboard</div>
      <div id="nav-statistics" class="nav-item" onclick="loadPage('statistics', this)">Thống kê</div>
      <div class="nav-group-label">Quản lý</div>
      <div id="nav-household" class="nav-item" onclick="loadPage('household', this)">Hộ khẩu</div>
      <div id="nav-resident" class="nav-item" onclick="loadPage('resident', this)">Nhân khẩu</div>
      <div class="nav-group-label">Hoạt động</div>
      <div id="nav-activity" class="nav-item" onclick="loadPage('activity', this)">Lịch sinh hoạt</div>
      <div id="nav-request" class="nav-item" onclick="loadPage('request', this)">Yêu cầu dân cư</div>
    </nav>
    <div style="padding: 15px; border-top: 1px solid rgba(255,255,255,0.05);">
      <a href="Login.html" class="nav-item" style="color: #f87171; font-size: 12px;">Đăng xuất</a>
    </div>
  </aside>

  <div class="main-layout">
    <header class="top-bar">
      <div style="font-size: 14px; font-weight: 500; color: var(--text-main);">Chào, Quản trị viên</div>
    </header>
    <main id="main-content" class="content-area">
      </main>
  </div>

  <script>
    const COLORS = ['#5a73f3', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#38b2ac'];

    // TRONG FILE Admin.html
      async function loadPage(pageName, element) {
        try {
          const response = await fetch(`pages/${pageName}.html`);
          const html = await response.text();
          document.getElementById('main-content').innerHTML = html;

          document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
          element.classList.add('active');

          // SỬA ĐOẠN NÀY: Ép chạy script để định nghĩa hàm fetchData[cite: 21]
          const scripts = document.getElementById('main-content').getElementsByTagName('script');
          for (let i = 0; i < scripts.length; i++) {
            eval(scripts[i].innerText);
          }

          if (pageName === 'resident') {
            setTimeout(() => {
              if (typeof window.fetchData === 'function') window.fetchData();
            }, 100);
          }
          if (pageName === 'activity') {
            setTimeout(() => {
              if (typeof window.fetchActivities === 'function') window.fetchActivities();
            }, 100);
          }
          if (pageName === 'request') {
            setTimeout(() => {
              if (typeof window.fetchRequests === 'function') window.fetchRequests();
            }, 100);
          }
          if (pageName === 'dashboard') {
            setTimeout(() => {
              if (typeof window.initDashboard === 'function') window.initDashboard();
            }, 100);
          }
          if (pageName === 'statistics') {
            setTimeout(() => {
              if (typeof window.initStatistics === 'function') window.initStatistics();
            }, 100);
          }
          if (pageName === 'household') {
            if (typeof window.initHouseholdPage === 'function') {
              window.initHouseholdPage();
            }
          }
        } catch (err) {
          console.error("Lỗi nạp trang:", err);
        }
      }

    // Tự động nạp Dashboard khi mở
    window.onload = () => loadPage('dashboard', document.getElementById('nav-dashboard'));
  </script>
</body>
</html>
