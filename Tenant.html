<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Hồ Sơ Cư Dân - Groupod</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; background: #f0f2f5; color: #333; }
    .sidebar { width: 260px; background: #1a1a1a; color: white; height: 100vh; position: fixed; padding-top: 20px; }
    .sidebar h2 { text-align: center; color: #5cb85c; margin-bottom: 30px; letter-spacing: 1px; }
    .nav-item { padding: 15px 25px; cursor: pointer; transition: 0.3s; border-left: 4px solid transparent; }
    .nav-item:hover { background: #2d2d2d; }
    .nav-item.active { background: #2d2d2d; border-left: 4px solid #5cb85c; color: #5cb85c; font-weight: bold; }
    .main-content { margin-left: 260px; flex: 1; padding: 40px; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
    .profile-header { display: flex; gap: 30px; align-items: flex-start; }
    .resident-photo { width: 130px; height: 170px; border: 3px solid #eee; border-radius: 8px; object-fit: cover; }
    .info-grid { display: grid; grid-template-columns: 160px 1fr; gap: 12px; flex: 1; }
    .info-label { font-weight: bold; color: #888; text-transform: uppercase; font-size: 12px; }
    .info-value { color: #2c3e50; font-size: 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #edf2f7; padding: 12px; text-align: left; }
    th { background: #f8fafc; color: #64748b; font-size: 13px; }
    .member-link { color: #5cb85c; text-decoration: none; font-weight: bold; cursor: pointer; }
    .btn-create { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .form-box { border: 1px solid #eee; padding: 20px; background: #fafafa; border-radius: 8px; margin: 15px 0; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
    .btn-group { text-align: right; margin-top: 20px; }
    .btn-send { background: #5cb85c; color: white; border: none; padding: 12px 30px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-cancel { background: #94a3b8; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; margin-right: 10px; }
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
    .modal-content { background: white; margin: 5% auto; padding: 30px; border-radius: 12px; width: 550px; position: relative; box-shadow: 0 5px 25px rgba(0,0,0,0.2); }
    .detail-row { margin-bottom: 15px; display: grid; grid-template-columns: 140px 1fr; border-bottom: 1px solid #f0f0f0; padding-bottom: 8px; }
  </style>
</head>
<body>

<div class="sidebar">
  <h2>GROUPOD</h2>
  <div id="nav-profile" class="nav-item active" onclick="switchTab('profile')">Hồ sơ cá nhân</div>
  <div id="nav-update" class="nav-item" onclick="switchTab('update')">Cập nhật thông tin</div>
  <div class="nav-item" onclick="location.href='Login.html'" style="margin-top: 60px; color: #e74c3c;">Đăng xuất</div>
</div>

<div class="main-content">
  <div id="tab-profile">
    <div class="card">
      <h2 id="profile-title" style="margin-top: 0;">Thông tin cá nhân</h2>
      <div class="profile-header">
        <img id="res-photo" src="" class="resident-photo">
        <div id="personal-info" class="info-grid"></div>
      </div>
      <h3>Thành viên gia đình</h3>
      <table><thead><tr><th>Họ và tên</th><th>Quan hệ</th><th>Nghề nghiệp</th></tr></thead><tbody id="family-body"></tbody></table>
    </div>
  </div>

  <div id="tab-update" style="display: none;">
    <div id="request-history-view">
      <div class="card">
        <h3>Gửi Yêu Cầu Mới</h3>
        <button class="btn-create" onclick="showRequestForm()">+ Tạo mới yêu cầu</button>
      </div>
      <div class="card">
        <h3>Lịch Sử Yêu Cầu</h3>
        <table><thead><tr><th>Mã</th><th>Đối tượng</th><th>Họ tên yêu cầu</th><th>Trạng thái</th><th>Hành động</th></tr></thead><tbody id="history-body"></tbody></table>
      </div>
    </div>

    <div id="request-form-container" style="display: none;">
      <div class="card">
        <h2>Yêu cầu điều chỉnh thông tin</h2>
        <p><strong>Đối tượng:</strong>
          <input type="radio" name="target" value="self" checked onclick="toggleFormMode(true)"> Bản thân
          <input type="radio" name="target" value="others" onclick="toggleFormMode(false)"> Khai hộ
        </p>
        <div class="form-box">
          <div class="grid-2">
            <div><label class="info-label">Họ tên sửa</label><input type="text" id="f-name"></div>
            <div><label class="info-label">Giới tính</label><input type="text" id="f-gender"></div>
          </div>
          <div class="grid-2" style="margin-top: 15px;">
            <div><label class="info-label">Số CCCD</label><input type="text" id="f-cccd"></div>
            <div><label class="info-label">Ngày sinh</label><input type="text" id="f-dob" value="20/02/2004"></div>
          </div>
        </div>
        <label class="info-label">Nội dung ghi chú</label>
        <textarea id="f-note" rows="4"></textarea>
        <div class="btn-group"><button class="btn-cancel" onclick="hideRequestForm()">Hủy</button><button class="btn-send" onclick="submitUpdate()">Gửi yêu cầu</button></div>
      </div>
    </div>
  </div>
</div>

<div id="detail-modal" class="modal">
  <div class="modal-content">
    <h3 style="margin-top:0; color:#2c3e50; border-bottom:2px solid #5cb85c; padding-bottom:10px;">Chi tiết nội dung đã gửi</h3>
    <div id="detail-body"></div>
    <div class="btn-group"><button class="btn-cancel" onclick="closeDetailModal()">Đóng</button></div>
  </div>
</div>

<script>
  let myOriginalData = null;
  let historyList = [];
  const myUser = new URLSearchParams(window.location.search).get('user') || 'phongg';

  async function loadData(targetUser) {
    try {
      const resp = await fetch(`http://localhost:8080/api/tenant/info?user=${targetUser}`);
      const data = await resp.json();
      if(targetUser === myUser && !myOriginalData) {
        myOriginalData = data;
        loadHistory();
      }
      document.getElementById('res-photo').src = data.photo;
      document.getElementById('personal-info').innerHTML = `
                <div class="info-label">Họ và tên:</div><div class="info-value">${data.name}</div>
                <div class="info-label">Quan hệ chủ hộ:</div><div class="info-value" style="color:#5cb85c; font-weight:bold">${data.relationToOwner}</div>
                <div class="info-label">Dân tộc:</div><div class="info-value">${data.ethnicity}</div>
                <div class="info-label">Quốc tịch:</div><div class="info-value">${data.nation}</div>
                <div class="info-label">Số CCCD:</div><div class="info-value">${data.cccd}</div>
                <div class="info-label">Giới tính:</div><div class="info-value">${data.gender}</div>
                <div class="info-label">Số điện thoại:</div><div class="info-value">${data.phone}</div>
                <div class="info-label">Số hộ khẩu:</div><div class="info-value">${data.household}</div>
            `;
      document.getElementById('family-body').innerHTML = data.family.map(m => `
                <tr><td><a class="member-link" onclick="loadData('${m.username}')">${m.name}</a></td>
                <td>${m.relation}</td><td>${m.job}</td></tr>`).join('');
      document.getElementById('profile-title').innerText = (targetUser === myUser) ? "Hồ sơ của tôi" : "Hồ sơ: " + data.name;
    } catch (e) { console.error(e); }
  }

  async function loadHistory() {
    const resp = await fetch(`http://localhost:8080/api/tenant/get-history?user=${myUser}`);
    historyList = await resp.json();
    const tbody = document.getElementById('history-body');
    if(historyList.length === 0) { tbody.innerHTML = "<tr><td colspan='5' style='text-align:center'>Trống</td></tr>"; return; }
    tbody.innerHTML = historyList.map((req, i) => `
            <tr style="cursor:pointer" onclick="viewDetail(${i})">
                <td>REQ-${100+i}</td><td>${req.target === 'self' ? 'Bản thân' : 'Khai hộ'}</td>
                <td>${req.name}</td><td style="color:orange; font-weight:bold">Đang chờ</td>
                <td><button class="member-link" style="background:none; border:none;">Chi tiết</button></td>
            </tr>`).join('');
  }

  function viewDetail(i) {
    const req = historyList[i];
    document.getElementById('detail-body').innerHTML = `
            <div class="detail-row"><span class="info-label">Loại:</span><span>${req.target === 'self' ? 'Bản thân' : 'Khai hộ'}</span></div>
            <div class="detail-row"><span class="info-label">Họ tên:</span><span style="font-weight:bold">${req.name}</span></div>
            <div class="detail-row"><span class="info-label">CCCD:</span><span>${req.cccd}</span></div>
            <div class="detail-row"><span class="info-label">Ghi chú:</span><div style="background:#f9f9f9; padding:10px; border-radius:5px;">${req.note || 'Trống'}</div></div>
        `;
    document.getElementById('detail-modal').style.display = "block";
  }

  function closeDetailModal() { document.getElementById('detail-modal').style.display = "none"; }
  function toggleFormMode(isSelf) {
    document.getElementById('f-name').value = isSelf ? myOriginalData.name : "";
    document.getElementById('f-gender').value = isSelf ? myOriginalData.gender : "";
    document.getElementById('f-cccd').value = isSelf ? myOriginalData.cccd : "";
  }
  function switchTab(t) {
    document.getElementById('tab-profile').style.display = (t==='profile'?'block':'none');
    document.getElementById('tab-update').style.display = (t==='update'?'block':'none');
    document.getElementById('nav-profile').classList.toggle('active', t==='profile');
    document.getElementById('nav-update').classList.toggle('active', t==='update');
  }
  function showRequestForm() { document.getElementById('request-history-view').style.display = 'none'; document.getElementById('request-form-container').style.display = 'block'; toggleFormMode(true); }
  function hideRequestForm() { document.getElementById('request-history-view').style.display = 'block'; document.getElementById('request-form-container').style.display = 'none'; }

  async function submitUpdate() {
    const payload = {
      target: document.querySelector('input[name="target"]:checked').value,
      name: document.getElementById('f-name').value,
      gender: document.getElementById('f-gender').value,
      cccd: document.getElementById('f-cccd').value,
      dob: document.getElementById('f-dob').value,
      note: document.getElementById('f-note').value,
      sender: myUser
    };
    await fetch('http://localhost:8080/api/tenant/update-request', { method: 'POST', body: JSON.stringify(payload) });
    alert("Đã gửi và lưu vĩnh viễn!");
    hideRequestForm();
    loadHistory();
  }

  window.onload = () => loadData(myUser);
  window.onclick = (e) => { if(e.target == document.getElementById('detail-modal')) closeDetailModal(); }
</script>
</body>
</html>
